<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chain of Thought — Sequential Probability Constraint</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080c10;
    color: #c8d8e8;
    font-family: 'IBM Plex Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  #header {
    position: absolute;
    top: 24px; left: 32px;
    pointer-events: none;
  }

  #title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #4a9eff;
    margin-bottom: 4px;
  }

  #subtitle {
    font-size: 12px;
    font-weight: 300;
    color: #607080;
    letter-spacing: 0.05em;
  }

  /* Step cards on the right */
  #step-panel {
    position: absolute;
    top: 80px;
    right: 24px;
    width: 240px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }

  .step-card {
    padding: 12px 14px;
    border-left: 2px solid #1e3a5a;
    background: rgba(8,12,16,0.75);
    backdrop-filter: blur(8px);
    transition: all 0.4s ease;
    opacity: 0.35;
  }

  .step-card.active {
    opacity: 1;
    border-left-color: var(--step-color);
    background: rgba(8,12,16,0.92);
  }

  .step-card.done {
    opacity: 0.65;
    border-left-color: var(--step-color);
  }

  .step-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: var(--step-color);
  }

  .step-label {
    font-size: 11px;
    font-weight: 600;
    color: #c8d8e8;
    margin-bottom: 3px;
  }

  .step-desc {
    font-size: 10px;
    font-weight: 300;
    color: #607080;
    line-height: 1.6;
  }

  /* Bottom controls */
  #controls {
    position: absolute;
    bottom: 24px;
    left: 32px;
    right: 280px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: all;
  }

  #mode-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .mode-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 14px;
    border: 1px solid #1e3a5a;
    background: rgba(8,12,16,0.8);
    color: #607080;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }

  .mode-btn:hover { border-color: #4a9eff; color: #4a9eff; }
  .mode-btn.active { border-color: #4a9eff; color: #080c10; background: #4a9eff; }

  #play-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 20px;
    border: 1px solid #22c55e;
    background: rgba(34,197,94,0.08);
    color: #22c55e;
    cursor: pointer;
    transition: all 0.2s;
  }
  #play-btn:hover { background: rgba(34,197,94,0.18); }

  #legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .leg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: #607080;
    text-transform: uppercase;
  }

  .leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  #drag-hint {
    position: absolute;
    bottom: 24px;
    right: 280px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: #1e3a5a;
    text-transform: uppercase;
    pointer-events: none;
  }

  #compare-note {
    position: absolute;
    top: 24px;
    right: 280px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: #2a4a6a;
    text-transform: uppercase;
    pointer-events: none;
    text-align: right;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="header">
  <div id="title">Chain of Thought — Sequential Constraint</div>
  <div id="subtitle">Each reasoning step anchors the next step's probability cone</div>
</div>

<div id="compare-note">MODE: CHAIN OF THOUGHT</div>

<div id="step-panel">
  <!-- filled by JS -->
</div>

<div id="controls">
  <div id="mode-row">
    <button class="mode-btn active" onclick="setMode('cot')">Chain of Thought</button>
    <button class="mode-btn" onclick="setMode('direct')">Direct Answer</button>
    <button class="mode-btn" onclick="setMode('broken')">Broken Chain</button>
    <button id="play-btn" onclick="replay()">↺ Replay</button>
  </div>
  <div id="legend">
    <div class="leg"><div class="leg-dot" style="background:#4a9eff"></div>reasoning step</div>
    <div class="leg"><div class="leg-dot" style="background:#22c55e"></div>constrained region</div>
    <div class="leg"><div class="leg-dot" style="background:#ff6b35"></div>anchor point</div>
    <div class="leg"><div class="leg-dot" style="background:#ff4444"></div>drift / error</div>
  </div>
</div>

<div id="drag-hint">drag to rotate · scroll to zoom</div>

<script>
// ── Renderer ──────────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x080c10, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(5, 3.5, 6);
camera.lookAt(1.5, 1, 0);

scene.add(new THREE.AmbientLight(0x1a2a3a, 3));
const dl = new THREE.DirectionalLight(0x4a9eff, 1.2);
dl.position.set(4, 6, 4);
scene.add(dl);

// ── Orbit ─────────────────────────────────────────────────────────────────────
let drag = false, pm = {x:0,y:0};
let sph = { theta: 0.5, phi: 0.75, r: 8 };
const lookAt = new THREE.Vector3(1.5, 1, 0);

function updateCam() {
  camera.position.set(
    lookAt.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    lookAt.y + sph.r * Math.cos(sph.phi),
    lookAt.z + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  camera.lookAt(lookAt);
}
updateCam();

const el = renderer.domElement;
el.addEventListener('mousedown', e => { drag=true; pm={x:e.clientX,y:e.clientY}; });
el.addEventListener('mouseup', ()=>drag=false);
el.addEventListener('mousemove', e => {
  if(!drag) return;
  sph.theta -= (e.clientX-pm.x)*0.005;
  sph.phi = Math.max(0.1, Math.min(Math.PI-0.1, sph.phi+(e.clientY-pm.y)*0.005));
  pm={x:e.clientX,y:e.clientY}; updateCam();
});
el.addEventListener('wheel', e => { sph.r=Math.max(4,Math.min(16,sph.r+e.deltaY*0.01)); updateCam(); });
el.addEventListener('touchstart', e=>{ drag=true; pm={x:e.touches[0].clientX,y:e.touches[0].clientY}; });
el.addEventListener('touchend', ()=>drag=false);
el.addEventListener('touchmove', e=>{
  if(!drag) return;
  sph.theta -= (e.touches[0].clientX-pm.x)*0.005;
  sph.phi = Math.max(0.1,Math.min(Math.PI-0.1,sph.phi+(e.touches[0].clientY-pm.y)*0.005));
  pm={x:e.touches[0].clientX,y:e.touches[0].clientY}; updateCam();
});

// ── Scene base ────────────────────────────────────────────────────────────────
function makeGrid() {
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({color:0x1a2a3a, transparent:true, opacity:0.3});
  for(let i=-1;i<=5;i++){
    const h=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1,0,i),new THREE.Vector3(5,0,i)]);
    const v=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i,0,-1),new THREE.Vector3(i,0,5)]);
    g.add(new THREE.Line(h,mat)); g.add(new THREE.Line(v,mat));
  }
  return g;
}
scene.add(makeGrid());

// ── Primitives ────────────────────────────────────────────────────────────────
function sphere(pos, r, color, opacity=1) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(r,16,16),
    new THREE.MeshPhongMaterial({color, transparent:opacity<1, opacity, emissive:color, emissiveIntensity:0.4})
  );
  m.position.copy(pos); return m;
}

function arrow(from, to, color, hs=0.09) {
  const dir = new THREE.Vector3().subVectors(to,from).normalize();
  return new THREE.ArrowHelper(dir, from, from.distanceTo(to), color, hs, hs*0.6);
}

function tube(points, color, r=0.015, opacity=1) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, points.length*4, r, 6, false);
  const mat = new THREE.MeshPhongMaterial({color, transparent:opacity<1, opacity, emissive:color, emissiveIntensity:0.2});
  return new THREE.Mesh(geo, mat);
}

function cone(origin, direction, halfAngle, color, opacity, wire=false) {
  const len = 0.9;
  const rad = len * Math.tan(halfAngle);
  const geo = new THREE.ConeGeometry(rad, len, 24, 1, true);
  geo.translate(0, len/2, 0);
  const mat = wire
    ? new THREE.MeshBasicMaterial({color, wireframe:true, transparent:true, opacity: opacity*0.4})
    : new THREE.MeshPhongMaterial({color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(origin);
  const dir = direction.clone().normalize();
  mesh.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir));
  return mesh;
}

function cloud(center, dir, halfAngle, count, color, spreadLen=0.7) {
  const positions = [];
  const d = dir.clone().normalize();
  let gen = 0;
  while(gen < count) {
    const v = new THREE.Vector3((Math.random()-.5)*2,(Math.random()-.5)*2,(Math.random()-.5)*2).normalize();
    if(v.angleTo(d) < halfAngle) {
      const t = 0.05 + Math.random()*spreadLen;
      positions.push(center.x+v.x*t, center.y+v.y*t, center.z+v.z*t);
      gen++;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  return new THREE.Points(geo, new THREE.PointsMaterial({color, size:0.035, transparent:true, opacity:0.55}));
}

// ── Mode data ─────────────────────────────────────────────────────────────────
const STEP_COLORS = ['#4a9eff','#a78bfa','#22c55e','#fb923c','#f9a8d4'];

const MODES = {
  cot: {
    label: 'CHAIN OF THOUGHT',
    steps: [
      { label: 'Initial Prompt', desc: 'Wide cone — model hasn\'t committed to any reasoning path yet.', color: '#4a9eff', pos: new THREE.Vector3(0,0,0), dir: new THREE.Vector3(0.3,1,0.2), angle: Math.PI/4 },
      { label: 'Step 1: Identify knowns', desc: 'First reasoning token narrows space — cone origin moves, angle tightens.', color: '#a78bfa', pos: new THREE.Vector3(0.8,0.6,0.3), dir: new THREE.Vector3(0.4,1,0.1), angle: Math.PI/7 },
      { label: 'Step 2: Apply constraint', desc: 'Second step further anchors — prior commit eliminates vast regions.', color: '#22c55e', pos: new THREE.Vector3(1.5,1.1,0.4), dir: new THREE.Vector3(0.5,1,0.05), angle: Math.PI/12 },
      { label: 'Step 3: Derive intermediate', desc: 'Cone tightens again — the path through space is now strongly defined.', color: '#fb923c', pos: new THREE.Vector3(2.2,1.5,0.45), dir: new THREE.Vector3(0.55,1,0.0), angle: Math.PI/20 },
      { label: 'Final Answer', desc: 'Tiny cone — constrained by every prior step. Variance is minimal.', color: '#f9a8d4', pos: new THREE.Vector3(2.9,1.85,0.48), dir: new THREE.Vector3(0.6,1,-0.05), angle: Math.PI/40 },
    ]
  },
  direct: {
    label: 'DIRECT ANSWER (no CoT)',
    steps: [
      { label: 'Initial Prompt', desc: 'Same starting cone as CoT — wide, unconstrained.', color: '#4a9eff', pos: new THREE.Vector3(0,0,0), dir: new THREE.Vector3(0.3,1,0.2), angle: Math.PI/4 },
      { label: 'Answer Token', desc: 'No intermediate steps. Model jumps directly to answer from the wide starting cone. High variance — the answer could land anywhere in the original space.', color: '#ff4444', pos: new THREE.Vector3(1.5,0.9,1.2), dir: new THREE.Vector3(0.8,1,0.6), angle: Math.PI/4.5 },
    ]
  },
  broken: {
    label: 'BROKEN CHAIN (reasoning error)',
    steps: [
      { label: 'Initial Prompt', desc: 'Standard start — wide cone.', color: '#4a9eff', pos: new THREE.Vector3(0,0,0), dir: new THREE.Vector3(0.3,1,0.2), angle: Math.PI/4 },
      { label: 'Step 1: Correct', desc: 'First step is sound — cone narrows appropriately.', color: '#a78bfa', pos: new THREE.Vector3(0.8,0.6,0.3), dir: new THREE.Vector3(0.4,1,0.1), angle: Math.PI/7 },
      { label: 'Step 2: Error introduced', desc: 'A flawed reasoning step shifts the cone origin — the path drifts from the correct region.', color: '#ff4444', pos: new THREE.Vector3(1.7,0.5,1.1), dir: new THREE.Vector3(0.9,0.6,0.8), angle: Math.PI/6 },
      { label: 'Step 3: Compounds error', desc: 'Each subsequent step anchors to the wrong location. The final answer is tightly constrained — but around the wrong point.', color: '#ff6b35', pos: new THREE.Vector3(2.8,0.2,1.9), dir: new THREE.Vector3(1.0,0.4,1.0), angle: Math.PI/14 },
    ]
  }
};

// ── Animation state ───────────────────────────────────────────────────────────
let currentMode = 'cot';
let activeGroup = new THREE.Group();
scene.add(activeGroup);

let animStep = -1;
let animTimer = null;
let builtSteps = [];

function buildStepCards(mode) {
  const panel = document.getElementById('step-panel');
  panel.innerHTML = '';
  MODES[mode].steps.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'step-card';
    card.id = `card-${i}`;
    card.style.setProperty('--step-color', s.color);
    card.innerHTML = `<div class="step-number">Step ${i === 0 ? '0 — Prompt' : i}</div><div class="step-label">${s.label}</div><div class="step-desc">${s.desc}</div>`;
    panel.appendChild(card);
  });
  document.getElementById('compare-note').textContent = `MODE: ${MODES[mode].label}`;
}

function activateCard(i) {
  document.querySelectorAll('.step-card').forEach((c,j) => {
    c.classList.remove('active','done');
    if(j < i) c.classList.add('done');
    if(j === i) c.classList.add('active');
  });
}

function addStep(stepIdx) {
  const mode = MODES[currentMode];
  const s = mode.steps[stepIdx];
  const prev = stepIdx > 0 ? mode.steps[stepIdx-1] : null;
  const color = parseInt(s.color.replace('#',''), 16);

  // Cone at this step's origin
  activeGroup.add(cone(s.pos, s.dir, s.angle, color, 0.08));
  activeGroup.add(cone(s.pos, s.dir, s.angle, color, 0.0, true));

  // Scatter cloud
  activeGroup.add(cloud(s.pos, s.dir, s.angle, 60, color, 0.75));

  // Sphere anchor
  activeGroup.add(sphere(s.pos, 0.07, color));

  // Tube from prev to this
  if(prev) {
    const pts = [prev.pos.clone(), s.pos.clone()];
    activeGroup.add(tube(pts, color, 0.018));
    activeGroup.add(arrow(prev.pos.clone(), s.pos.clone(), color, 0.07));
  }

  activateCard(stepIdx);
}

function replay() {
  clearTimeout(animTimer);
  scene.remove(activeGroup);
  activeGroup = new THREE.Group();
  scene.add(activeGroup);
  builtSteps = [];
  animStep = -1;
  runAnimation();
}

function runAnimation() {
  const steps = MODES[currentMode].steps;
  animStep++;
  if(animStep >= steps.length) return;
  addStep(animStep);
  animTimer = setTimeout(runAnimation, animStep === 0 ? 800 : 1400);
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.mode-btn[onclick="setMode('${mode}')"]`).classList.add('active');
  buildStepCards(mode);
  replay();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
buildStepCards('cot');
setTimeout(() => runAnimation(), 400);

// ── Render loop ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if(!drag) { sph.theta += 0.0015; updateCam(); }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
