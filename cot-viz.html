<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chain of Thought — Sequential Probability Constraint</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080c10;
    color: #c8d8e8;
    font-family: 'IBM Plex Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  #header {
    position: absolute;
    top: 24px; left: 32px;
    pointer-events: none;
  }

  #title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #4a9eff;
    margin-bottom: 4px;
  }

  #subtitle {
    font-size: 12px;
    font-weight: 300;
    color: #607080;
    letter-spacing: 0.05em;
  }

  /* Step cards on the right */
  #step-panel {
    position: absolute;
    top: 80px;
    right: 24px;
    width: 240px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
  }

  .step-card {
    padding: 12px 14px;
    border-left: 2px solid #1e3a5a;
    background: rgba(8,12,16,0.75);
    backdrop-filter: blur(8px);
    transition: all 0.4s ease;
    opacity: 0.35;
  }

  .step-card.active {
    opacity: 1;
    border-left-color: var(--step-color);
    background: rgba(8,12,16,0.92);
  }

  .step-card.done {
    opacity: 0.65;
    border-left-color: var(--step-color);
  }

  .step-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: var(--step-color);
  }

  .step-label {
    font-size: 11px;
    font-weight: 600;
    color: #c8d8e8;
    margin-bottom: 3px;
  }

  .step-desc {
    font-size: 10px;
    font-weight: 300;
    color: #607080;
    line-height: 1.6;
  }

  /* Bottom controls */
  #controls {
    position: absolute;
    bottom: 24px;
    left: 32px;
    right: 280px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: all;
  }

  #mode-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .mode-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 14px;
    border: 1px solid #1e3a5a;
    background: rgba(8,12,16,0.8);
    color: #607080;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }

  .mode-btn:hover { border-color: #4a9eff; color: #4a9eff; }
  .mode-btn.active { border-color: #4a9eff; color: #080c10; background: #4a9eff; }

  #play-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 20px;
    border: 1px solid #22c55e;
    background: rgba(34,197,94,0.08);
    color: #22c55e;
    cursor: pointer;
    transition: all 0.2s;
  }
  #play-btn:hover { background: rgba(34,197,94,0.18); }

  #legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .leg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: #607080;
    text-transform: uppercase;
  }

  .leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  #drag-hint {
    position: absolute;
    bottom: 24px;
    right: 280px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: #1e3a5a;
    text-transform: uppercase;
    pointer-events: none;
  }

  #compare-note {
    position: absolute;
    top: 24px;
    right: 280px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: #2a4a6a;
    text-transform: uppercase;
    pointer-events: none;
    text-align: right;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="header">
  <div id="title">Chain of Thought — Sequential Constraint</div>
  <div id="subtitle">Each reasoning step anchors the next step's probability cone</div>
</div>

<div id="compare-note">MODE: CHAIN OF THOUGHT</div>

<div id="step-panel">
  <!-- filled by JS -->
</div>

<div id="controls">
  <div id="mode-row">
    <button class="mode-btn active" onclick="setMode('cot')">Chain of Thought</button>
    <button class="mode-btn" onclick="setMode('direct')">Direct Answer</button>
    <button class="mode-btn" onclick="setMode('broken')">Broken Chain</button>
    <button class="mode-btn" onclick="setMode('contradictory')">Contradictory Chain</button>
    <button id="play-btn" onclick="replay()">↺ Replay</button>
    <button id="pause-btn" onclick="togglePause()" style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:7px 20px;border:1px solid #f59e0b;background:rgba(245,158,11,0.08);color:#f59e0b;cursor:pointer;transition:all 0.2s;">⏸ Pause</button>
    <button onclick="stepForward()" style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:7px 16px;border:1px solid #1e3a5a;background:rgba(8,12,16,0.8);color:#607080;cursor:pointer;transition:all 0.2s;">▶ Step</button>
  </div>
  
</div>

<div id="drag-hint">drag to rotate · scroll to zoom</div>

<script>
// ── Renderer ──────────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x080c10, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(5, 3.5, 6);
camera.lookAt(1.5, 1, 0);

scene.add(new THREE.AmbientLight(0x1a2a3a, 3));
const dl = new THREE.DirectionalLight(0x4a9eff, 1.2);
dl.position.set(4, 6, 4);
scene.add(dl);

// ── Orbit ─────────────────────────────────────────────────────────────────────
let drag = false, pm = {x:0,y:0};
let sph = { theta: 0.5, phi: 0.6, r: 16 };
const lookAt = new THREE.Vector3(-1.0, -0.3, 0.0);

function updateCam() {
  camera.position.set(
    lookAt.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    lookAt.y + sph.r * Math.cos(sph.phi),
    lookAt.z + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  camera.lookAt(lookAt);
}
updateCam();

const el = renderer.domElement;
el.addEventListener('mousedown', e => { drag=true; pm={x:e.clientX,y:e.clientY}; });
el.addEventListener('mouseup', ()=>drag=false);
el.addEventListener('mousemove', e => {
  if(!drag) return;
  sph.theta -= (e.clientX-pm.x)*0.005;
  sph.phi = Math.max(0.1, Math.min(Math.PI-0.1, sph.phi+(e.clientY-pm.y)*0.005));
  pm={x:e.clientX,y:e.clientY}; updateCam();
});
el.addEventListener('wheel', e => { sph.r=Math.max(4,Math.min(16,sph.r+e.deltaY*0.01)); updateCam(); });
el.addEventListener('touchstart', e=>{ drag=true; pm={x:e.touches[0].clientX,y:e.touches[0].clientY}; });
el.addEventListener('touchend', ()=>drag=false);
el.addEventListener('touchmove', e=>{
  if(!drag) return;
  sph.theta -= (e.touches[0].clientX-pm.x)*0.005;
  sph.phi = Math.max(0.1,Math.min(Math.PI-0.1,sph.phi+(e.touches[0].clientY-pm.y)*0.005));
  pm={x:e.touches[0].clientX,y:e.touches[0].clientY}; updateCam();
});

// ── Scene base ────────────────────────────────────────────────────────────────
function makeGrid() {
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({color:0x1a2a3a, transparent:true, opacity:0.3});
  for(let i=-4;i<=5;i++){
    const h=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4,0,i),new THREE.Vector3(5,0,i)]);
    const v=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i,0,-4),new THREE.Vector3(i,0,5)]);
    g.add(new THREE.Line(h,mat)); g.add(new THREE.Line(v,mat));
  }
  return g;
}
scene.add(makeGrid());

// ── Primitives ────────────────────────────────────────────────────────────────
function sphere(pos, r, color, opacity=1) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(r,16,16),
    new THREE.MeshPhongMaterial({color, transparent:opacity<1, opacity, emissive:color, emissiveIntensity:0.4})
  );
  m.position.copy(pos); return m;
}

function arrow(from, to, color, hs=0.09) {
  const dir = new THREE.Vector3().subVectors(to,from).normalize();
  return new THREE.ArrowHelper(dir, from, from.distanceTo(to), color, hs, hs*0.6);
}

function tube(points, color, r=0.015, opacity=1) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, points.length*4, r, 6, false);
  const mat = new THREE.MeshPhongMaterial({color, transparent:opacity<1, opacity, emissive:color, emissiveIntensity:0.2});
  return new THREE.Mesh(geo, mat);
}

function cone(origin, direction, halfAngle, color, opacity, wire=false) {
  const len = 0.9;
  const rad = len * Math.tan(halfAngle);
  const geo = new THREE.ConeGeometry(rad, len, 24, 1, true);
  // Shift so tip is at y=0, base at y=-len (opens in -Y by default)
  geo.translate(0, -len/2, 0);
  const mat = wire
    ? new THREE.MeshBasicMaterial({color, wireframe:true, transparent:true, opacity: opacity*0.4})
    : new THREE.MeshPhongMaterial({color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false});
  const mesh = new THREE.Mesh(geo, mat);
  const dir = direction.clone().normalize();
  // Align -Y to dir so cone opens toward dir with tip at origin
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,-1,0), dir);
  mesh.quaternion.copy(q);
  mesh.position.copy(origin);
  return mesh;
}

// Real GloVe PCA word positions (from prompt-geometry-viz)
// Coordinates match prompt-geometry-viz exactly: size→X, type→Y, spec→Z, SCALE=3.5
const S = 3.5;
const W = {
  cat:       new THREE.Vector3(-1.6029*S, -0.4253*S, -0.3635*S),
  lion:      new THREE.Vector3(-0.8531*S, -0.3207*S,  0.0102*S),
  whale:     new THREE.Vector3(-0.5786*S, -0.2444*S,  0.1542*S),
  paris:     new THREE.Vector3( 0.3903*S, -0.0240*S, -1.2324*S),
  tokyo:     new THREE.Vector3( 0.6486*S,  0.0737*S, -0.8751*S),
  london:    new THREE.Vector3( 0.4980*S,  0.0345*S, -1.0709*S),
  cairo:     new THREE.Vector3( 0.7210*S,  0.0680*S, -0.7107*S),
  happy:     new THREE.Vector3(-0.4097*S,  0.4338*S,  0.2076*S),
  angry:     new THREE.Vector3( 0.4573*S,  0.5840*S,  0.6607*S),
  fear:      new THREE.Vector3( 0.3703*S,  0.6396*S,  0.5933*S),
  joy:       new THREE.Vector3(-0.2208*S,  0.4649*S,  0.3167*S),
  computer:  new THREE.Vector3( 0.6330*S, -0.5958*S,  0.5821*S),
  algorithm: new THREE.Vector3( 0.8757*S, -0.5110*S,  0.7147*S),
  software:  new THREE.Vector3( 0.7146*S, -0.5610*S,  0.6210*S),
  bread:     new THREE.Vector3(-0.5704*S,  0.1948*S,  0.1535*S),
  wine:      new THREE.Vector3(-0.4328*S,  0.1566*S,  0.2157*S),
  apple:     new THREE.Vector3(-0.6404*S,  0.0322*S,  0.0228*S),
};

// Word dots for scene context
const WORD_COLORS = {
  cat:0x1D9E75, lion:0x1D9E75, whale:0x1D9E75,
  paris:0xD85A30, tokyo:0xD85A30, london:0xD85A30, cairo:0xD85A30,
  happy:0xE040FB, angry:0xE040FB, fear:0xE040FB, joy:0xE040FB,
  computer:0x7F77DD, algorithm:0x7F77DD, software:0x7F77DD,
  bread:0x888780, wine:0x888780, apple:0x888780,
};

const wordDotMeshes = {};
const wordSprites = {};
function addWordDots() {
  Object.entries(W).forEach(([word, pos]) => {
    const c = WORD_COLORS[word];
    const dot = sphere(pos, 0.06, c, 0.7);
    scene.add(dot);
    wordDotMeshes[word] = dot;
    const canvas = document.createElement('canvas');
    canvas.width = 200; canvas.height = 48;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = `#${c.toString(16).padStart(6,'0')}`;
    ctx.font = 'bold 20px IBM Plex Mono, monospace';
    ctx.fillText(word, 6, 32);
    const tex = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0.5}));
    sprite.position.copy(pos).add(new THREE.Vector3(0, 0.25, 0));
    sprite.scale.set(1.2, 0.28, 1);
    scene.add(sprite);
    wordSprites[word] = sprite;
  });
}
addWordDots();

function highlightDotsInCone(origin, dir, halfAngle, highlightColor) {
  const d = dir.clone().normalize();
  Object.entries(W).forEach(([word, pos]) => {
    const toWord = new THREE.Vector3().subVectors(pos, origin);
    const angle = toWord.length() > 0.01 ? toWord.normalize().angleTo(d) : 0;
    const dot = wordDotMeshes[word];
    const sprite = wordSprites[word];
    if(angle < halfAngle) {
      dot.material.color.setHex(0xffdd44);
      dot.material.emissive.setHex(0xffaa00);
      dot.material.emissiveIntensity = 0.9;
      dot.material.opacity = 1.0;
      dot.scale.setScalar(1.8);
      sprite.material.opacity = 1.0;
    } else {
      dot.material.color.setHex(WORD_COLORS[word]);
      dot.material.emissive.setHex(0x000000);
      dot.material.emissiveIntensity = 0.1;
      dot.material.opacity = 0.25;
      dot.scale.setScalar(1.0);
      sprite.material.opacity = 0.3;
    }
  });
}

// ── Mode data ─────────────────────────────────────────────────────────────────
const STEP_COLORS = ['#4a9eff','#a78bfa','#22c55e','#fb923c','#f9a8d4'];

const MODES = {
  cot: {
    label: 'CHAIN OF THOUGHT',
    steps: [
      {

        color: '#4a9eff',
        pos: new THREE.Vector3(0.0, 0.0, 0.0),
        dir: new THREE.Vector3(-0.9488, -0.3097, -0.0623).normalize(),
        angle: Math.PI/4
      },
      {
        label: 'Step 1: "A large animal"',

        color: '#a78bfa',
        pos: new THREE.Vector3(0, 0, 0),
        dir: new THREE.Vector3(-0.9023, -0.3880, 0.1878).normalize(),
        angle: Math.PI/9
      },
      {
        label: 'Step 2: "A large ocean animal"',
        desc: 'Cone vertex at previous arrow tip. Beam tightens — whale now alone in beam.',
        color: '#22c55e',
        pos: new THREE.Vector3(0, 0, 0),

        angle: Math.PI/16
      },
      {

        color: '#fb923c',
        pos: new THREE.Vector3(0, 0, 0),
        dir: new THREE.Vector3(0.5962, 0.3777, -0.7085).normalize(),

      },
    ]
  },
  direct: {
    label: 'DIRECT ANSWER (no CoT)',
    steps: [
      {
        label: 'Initial Prompt: "Write about an animal"',
        desc: 'Same wide starting cone from origin — pointing toward the animal cluster.',
        color: '#4a9eff',
        pos: new THREE.Vector3(0.0, 0.0, 0.0),
        dir: new THREE.Vector3(-0.9488, -0.3097, -0.0623).normalize(),
        angle: Math.PI/4
      },
      {

        desc: 'No intermediate steps. Wide cone remains — could output cat, lion, whale, or nearby food words with similar probability. High variance.',
        color: '#ff4444',

  },
  broken: {

    steps: [
      {

        color: '#4a9eff',

      },
      {

      },
      {

        color: '#ff4444',

      },
      {

        color: '#ff6b35',

      },

  },
  contradictory: {

      {

        color: '#4a9eff',

      },
      {

        color: '#a78bfa',

// ── Animation state ───────────────────────────────────────────────────────────
let currentMode = 'cot';
let activeGroup = new THREE.Group();
scene.add(activeGroup);

let animStep = -1;
let animTimer = null;
let builtSteps = [];

function buildStepCards(mode) {
  const panel = document.getElementById('step-panel');
  panel.innerHTML = '';
  MODES[mode].steps.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'step-card';
    card.id = `card-${i}`;
    card.style.setProperty('--step-color', s.color);
    card.innerHTML = `<div class="step-number">Step ${i === 0 ? '0 — Prompt' : i}</div><div class="step-label">${s.label}</div><div class="step-desc">${s.desc}</div>`;
    panel.appendChild(card);
  });
  document.getElementById('compare-note').textContent = `MODE: ${MODES[mode].label}`;
}

function activateCard(i) {
  document.querySelectorAll('.step-card').forEach((c,j) => {
    c.classList.remove('active','done');
    if(j < i) c.classList.add('done');
    if(j === i) c.classList.add('active');
  });
}

const BEAM_LEN = 1.4;



const coneMeshes = [];
const CONE_LEN = 0.9; // shared constant — cone and arrow use same length

function makeBeam(pos, dir, angle, color) {
  // Single group: cone + arrow sharing exact origin and direction
  const group = new THREE.Group();
  const d = dir.clone().normalize();

  // Cone: tip at group origin, opens along +dir
  const rad = CONE_LEN * Math.tan(angle);
  const coneGeo = new THREE.ConeGeometry(rad, CONE_LEN, 24, 1, true);
  coneGeo.translate(0, -CONE_LEN/2, 0); // tip at y=0, base at y=-CONE_LEN
  const solidMat = new THREE.MeshPhongMaterial({color, transparent:true, opacity:0.08, side:THREE.DoubleSide, depthWrite:false});
  const wireMat  = new THREE.MeshBasicMaterial({color, wireframe:true, transparent:true, opacity:0.25});
  const solidMesh = new THREE.Mesh(coneGeo, solidMat);
  const wireMesh  = new THREE.Mesh(coneGeo.clone(), wireMat);

  // Rotate so -Y aligns with dir (cone opens in dir direction)
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,-1,0), d);
  solidMesh.quaternion.copy(q);
  wireMesh.quaternion.copy(q);
  group.add(solidMesh);
  group.add(wireMesh);

  // Arrow: same origin, same direction, same length as cone
  const arrowTip = d.clone().multiplyScalar(CONE_LEN * 0.92);
  const arrowHelper = new THREE.ArrowHelper(d, new THREE.Vector3(0,0,0), CONE_LEN, color, 0.12, 0.07);
  group.add(arrowHelper);

  // Small origin dot
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.05,12,12), new THREE.MeshPhongMaterial({color, emissive:color, emissiveIntensity:0.5}));
  group.add(dot);

  group.position.copy(pos);
  return group;
}

function addStep(stepIdx) {
  const mode = MODES[currentMode];
  const s = mode.steps[stepIdx];
  const prev = stepIdx > 0 ? mode.steps[stepIdx-1] : null;
  const color = parseInt(s.color.replace('#',''), 16);

  // Compute this step's actual position from previous arrow tip
  if(prev) {
    const prevTip = prev.pos.clone().add(prev.dir.clone().normalize().multiplyScalar(CONE_LEN));
    s.pos.copy(prevTip);
    // Connecting tube from previous step origin to this step origin (= prev arrow tip)
    activeGroup.add(tube([prev.pos.clone(), s.pos.clone()], color, 0.015, 0.7));
  }

  // Beam group: cone + arrow as one unit
  const beam = makeBeam(s.pos, s.dir, s.angle, color);
  activeGroup.add(beam);
  coneMeshes.push(beam);

  // Keep only last 2 beams visible
  if(coneMeshes.length > 2) {
    activeGroup.remove(coneMeshes.shift());
  }

  // Highlight semantic word dots in beam — yellow, with labels
  highlightDotsInCone(s.pos, s.dir, s.angle, 0xffdd44);

  activateCard(stepIdx);
}

function replay() {
  clearTimeout(animTimer);
  paused = false;
  const btn = document.getElementById('pause-btn');
  if(btn) { btn.textContent='⏸ Pause'; btn.style.borderColor='#f59e0b'; btn.style.color='#f59e0b'; btn.style.background='rgba(245,158,11,0.08)'; }
  scene.remove(activeGroup);
  activeGroup = new THREE.Group();
  scene.add(activeGroup);
  builtSteps = [];
  animStep = -1;
  coneMeshes.length = 0;
  // Reset all dot highlights
  Object.entries(W).forEach(([word, pos]) => {
    const dot = wordDotMeshes[word];
    dot.material.color.setHex(WORD_COLORS[word]);
    dot.material.emissive.setHex(0x000000);
    dot.material.emissiveIntensity = 0.2;
    dot.material.opacity = 0.7;
    dot.scale.setScalar(1.0);
    wordSprites[word].material.opacity = 0.5;
  });
  runAnimation();
}

let paused = false;

function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pause-btn');
  if(paused) {
    clearTimeout(animTimer);
    btn.textContent = '▶ Resume';
    btn.style.borderColor = '#22c55e';
    btn.style.color = '#22c55e';
    btn.style.background = 'rgba(34,197,94,0.08)';
  } else {
    btn.textContent = '⏸ Pause';
    btn.style.borderColor = '#f59e0b';
    btn.style.color = '#f59e0b';
    btn.style.background = 'rgba(245,158,11,0.08)';
    runAnimation();
  }
}

function stepForward() {
  clearTimeout(animTimer);
  paused = true;
  const btn = document.getElementById('pause-btn');
  btn.textContent = '▶ Resume';
  btn.style.borderColor = '#22c55e';
  btn.style.color = '#22c55e';
  btn.style.background = 'rgba(34,197,94,0.08)';
  const steps = MODES[currentMode].steps;
  animStep++;
  if(animStep >= steps.length) { animStep = steps.length - 1; return; }
  addStep(animStep);
}

function runAnimation() {
  if(paused) return;
  const steps = MODES[currentMode].steps;
  animStep++;
  if(animStep >= steps.length) return;
  addStep(animStep);
  animTimer = setTimeout(runAnimation, animStep === 0 ? 800 : 1400);
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.mode-btn[onclick="setMode('${mode}')"]`).classList.add('active');
  buildStepCards(mode);
  replay();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
buildStepCards('cot');
setTimeout(() => runAnimation(), 400);

// ── Render loop ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
